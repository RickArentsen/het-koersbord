<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>READ · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
/* the live coverage card */
.lcov{text-transform:none;letter-spacing:normal;display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .8rem;align-items:baseline;padding:.65rem .8rem;border:1px solid var(--rule-strong);background:var(--sunk);}
.lcov .pill{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:.1rem .4rem;border:1px solid var(--rule-strong);color:var(--ink-mid);white-space:nowrap;}
.lcov .pill.on{border-color:var(--loss);color:#fff;background:rgba(220,70,60,.18);}
.lcov .pill.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--loss);margin-right:.35rem;vertical-align:middle;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.lcov a.t{font-family:var(--f-ui);font-size:.98rem;font-weight:500;color:var(--ink);line-height:1.35;}
.lcov a.t:hover{color:var(--accent);text-decoration:none;}
.lcov .s{font-size:.64rem;color:var(--ink-soft);white-space:nowrap;}
.lcov .more{grid-column:2/4;font-size:.68rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:.15rem;}
.lcov .more a{color:var(--ink-mid);font-family:var(--f-ui);}
@media(max-width:640px){.lcov{grid-template-columns:1fr;}.lcov .more{grid-column:1;}}
/* status and the editor */
.status{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;font-size:.68rem;color:var(--ink-mid);margin:.6rem 0;}
.status b{color:var(--ink);font-weight:500;}
.status .sp{flex:1;}
.job{border:1px solid var(--accent-dim);background:rgba(79,168,206,.06);padding:.5rem .7rem;font-size:.72rem;margin:.4rem 0;}
.job .tail{font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);margin-top:.35rem;max-height:5.5em;overflow:hidden;white-space:pre-wrap;}
.ed{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-mid);line-height:1.5;}
.ed .sk{display:grid;grid-template-columns:1fr auto;gap:.5rem;padding:.25rem 0;border-bottom:1px dotted var(--rule);font-size:.74rem;}
.ed .sk .why{color:var(--ink-soft);font-size:.68rem;}
/* layout */
.cols{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:1rem;align-items:start;}
@media(max-width:1100px){.cols{grid-template-columns:1fr;}.cols.reading .list{display:none;}}
@media(min-width:1101px){.list{position:sticky;top:calc(var(--barh) + .5rem);max-height:calc(100vh - var(--barh) - 1.5rem);overflow-y:auto;scrollbar-width:thin;}}
.day{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding:.7rem 0 .25rem;border-bottom:1px solid var(--rule-strong);}
.it{display:block;padding:.5rem .4rem;border-bottom:1px dotted var(--rule);color:inherit;}
.it:hover{background:#0E151A;text-decoration:none;}
.it.on{background:#0D161B;box-shadow:inset 2px 0 0 var(--accent);}
.it .k{display:flex;gap:.45rem;align-items:center;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.it .h{font-family:var(--f-ui);font-size:.86rem;font-weight:500;color:var(--ink);line-height:1.35;margin:.2rem 0 .15rem;}
.it.unread .h::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:.4rem;vertical-align:middle;}
.it .d{font-family:var(--f-ui);font-size:.72rem;color:var(--ink-mid);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.imp{letter-spacing:.06em;color:var(--warn);font-size:.62rem;}
.imp i{font-style:normal;color:var(--rule-strong);}
.kind{border:1px solid var(--rule-strong);padding:0 .3rem;color:var(--ink-mid);}
.kind.event{border-color:#b5652e;color:#e09a62;} .kind.earnings{border-color:#3a8a62;color:#62c08e;}
.kind.research{border-color:#6b5fb0;color:#a99be8;} .kind.macro{border-color:#3d79b0;color:#7fb5e6;}
.kind.review,.kind.ahead{border-color:var(--accent);color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem;}
.chip.t{font-size:.6rem;padding:0 .3rem;border:1px solid var(--rule-strong);color:var(--ink-mid);}
.chip.t.mine{border-color:var(--warn);color:var(--warn);}
/* the article */
.art{max-width:76ch;margin:0 auto;padding:.4rem .2rem 2rem;}
.art .back{display:none;font-size:.7rem;margin-bottom:.5rem;}
@media(max-width:1100px){.art .back{display:inline-block;}}
.art .kick{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.art h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.85rem;line-height:1.18;letter-spacing:-.005em;margin:.45rem 0 .5rem;color:#EEF4F6;}
.art .dek{font-family:var(--f-ui);font-size:1.02rem;line-height:1.5;color:var(--ink-mid);margin:0 0 .9rem;}
.art .upd{font-family:var(--f-ui);font-size:.78rem;border-left:2px solid var(--warn);padding:.35rem .7rem;margin:.6rem 0;background:rgba(232,176,75,.06);color:var(--ink);}
.take{border-left:2px solid var(--accent);padding:.5rem .8rem;margin:.8rem 0 1rem;background:rgba(79,168,206,.05);}
.take .lb,.box .lb{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem;}
.take ul{margin:0;padding-left:1.1rem;font-family:var(--f-ui);font-size:.86rem;line-height:1.55;}
.take li{margin:.18rem 0;}
.prose{font-family:"Source Serif 4",Georgia,serif;font-size:1.04rem;line-height:1.68;color:#DCE4E8;}
.prose h2{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);margin:1.5rem 0 .5rem;padding-bottom:.25rem;border-bottom:1px solid var(--rule);}
.prose p{margin:.55rem 0;}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin:.7rem 0;font-family:var(--f-ui);font-size:.76rem;}
.chain span{border:1px solid var(--rule-strong);padding:.2rem .5rem;background:var(--sunk);color:var(--ink);}
.chain i{font-style:normal;color:var(--accent);}
.box{border:1px solid var(--rule-strong);padding:.6rem .75rem;margin:1rem 0;background:var(--sunk);}
.box .btab td .dim{display:inline-block;max-width:16rem;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;}
.box p{font-family:var(--f-ui);font-size:.84rem;line-height:1.55;margin:.4rem 0 0;color:var(--ink);}
.btab{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:.3rem;}
.btab th{font-weight:500;color:var(--ink-soft);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:.25rem .4rem;border-bottom:1px solid var(--rule-strong);}
.btab td{text-align:right;padding:.26rem .4rem;border-bottom:1px dotted var(--rule);white-space:nowrap;}
.btab th:first-child,.btab td:first-child{text-align:left;}
.fig{margin:1.2rem 0;}
.fig .ft{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;}
.fig .fs{font-size:.62rem;color:var(--ink-soft);margin-top:.25rem;font-family:var(--f-ui);}
.map svg{display:block;width:100%;height:auto;background:#081016;border:1px solid var(--rule);}
.tl{position:relative;margin:.3rem 0 0 .4rem;padding-left:1rem;border-left:1px solid var(--rule-strong);}
.tl .e{position:relative;padding:.25rem 0;font-family:var(--f-ui);font-size:.82rem;line-height:1.45;}
.tl .e::before{content:"";position:absolute;left:-1.3rem;top:.65rem;width:7px;height:7px;border-radius:50%;background:var(--accent);}
.tl .e b{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-mid);font-weight:500;margin-right:.4rem;}
.bars .b{display:grid;grid-template-columns:minmax(90px,32%) 1fr 4.5rem;gap:.5rem;align-items:center;font-size:.72rem;padding:.12rem 0;}
.bars .b .l{color:var(--ink-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bars .b .t{height:11px;background:var(--sunk);position:relative;}
.bars .b .t i{position:absolute;top:1px;bottom:1px;background:var(--s1);}
.bars .b .v{text-align:right;}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1rem 0;}
@media(max-width:640px){.bb{grid-template-columns:1fr;}.box .btab td .dim{display:none;}}
.bb > div{border:1px solid var(--rule);padding:.5rem .7rem;}
.bb .lb{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.25rem;}
.bb ul{margin:0;padding-left:1rem;font-family:var(--f-ui);font-size:.82rem;line-height:1.5;}
.watch{font-family:var(--f-ui);font-size:.84rem;}
.watch .w{display:grid;grid-template-columns:5.5rem 1fr;gap:.6rem;padding:.25rem 0;border-bottom:1px dotted var(--rule);}
.watch .w b{font-family:var(--f-mono);font-size:.7rem;color:var(--accent);font-weight:500;}
blockquote.q{font-family:"Source Serif 4",Georgia,serif;font-size:1.15rem;font-style:italic;color:var(--ink);border-left:2px solid var(--rule-strong);margin:1.1rem 0;padding:.2rem 0 .2rem .9rem;}
blockquote.q cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:.72rem;color:var(--ink-soft);margin-top:.3rem;}
.srcs{font-family:var(--f-ui);font-size:.76rem;line-height:1.5;padding-left:1.2rem;}
.srcs li{margin:.25rem 0;} .srcs .u{color:var(--ink-soft);font-size:.7rem;}
.ask textarea{width:100%;min-height:3.2rem;background:var(--ground);border:1px solid var(--rule-strong);color:var(--ink);font-family:var(--f-ui);font-size:.84rem;padding:.45rem .55rem;resize:vertical;}
.ask textarea:focus{border-color:var(--accent);outline:none;}
.ans{margin-top:.7rem;border-top:1px dotted var(--rule);padding-top:.5rem;}
.ans .qq{font-size:.7rem;color:var(--ink-soft);margin-bottom:.2rem;}
.ans .md{font-family:var(--f-ui);font-size:.86rem;line-height:1.6;}
.ans .md p{margin:.4rem 0;}
.ans .md table{border-collapse:collapse;font-size:.76rem;margin:.4rem 0;}
.ans .md th,.ans .md td{border-bottom:1px solid var(--rule);padding:.25rem .45rem;text-align:left;vertical-align:top;}
.ans .md th{color:var(--ink-soft);font-weight:500;font-size:.66rem;}
.ans .md strong{color:#DCE6EA;}
.ans .md ul,.ans .md ol{padding-left:1.2rem;margin:.35rem 0;}
.meta{font-size:.62rem;color:var(--ink-soft);margin-top:1.4rem;border-top:1px solid var(--rule);padding-top:.5rem;line-height:1.6;}
.vers .v{font-family:var(--f-ui);font-size:.78rem;padding:.25rem 0;border-bottom:1px dotted var(--rule);}
.empty{font-family:var(--f-ui);font-size:.86rem;color:var(--ink-mid);line-height:1.6;padding:1rem 0;max-width:60ch;}
</style>
</head>

<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>

<script src="/kit.js"></script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVO · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
#tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
.disc{font-family:var(--f-ui);font-size:.72rem;color:var(--ink-soft);margin-top:.45rem;line-height:1.5;}
.busy{opacity:.55;transition:opacity .15s;}

/* the controls */
#ctl{position:sticky;top:var(--barh);z-index:30;background:var(--surface);border:1px solid var(--rule-strong);padding:.45rem .65rem;
  display:flex;flex-wrap:wrap;gap:.45rem 1.1rem;align-items:center;font-size:.68rem;}
#ctl .lbl{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-right:.35rem;}
#ctl .grp2{display:inline-flex;align-items:center;}
#ctl .grp2 .seg{margin-left:-1px;}
#ctl input[type=number]{background:var(--ground);border:1px solid var(--rule-strong);color:var(--ink);padding:.14rem .35rem;
  font-family:var(--f-mono);font-size:.7rem;width:8.5ch;}
#ctl .why{font-family:var(--f-ui);color:var(--ink-soft);font-size:.64rem;}
@media(max-width:760px){#ctl{position:static;}}

/* the frontier */
.fr{position:relative;width:100%;}
.fr svg{display:block;width:100%;overflow:visible;}
.fr .ax{font-size:10px;fill:var(--ink-soft);font-family:var(--f-mono);}
.fr .gl{stroke:var(--rule);stroke-width:1;}
.fr .zl{stroke:var(--rule-strong);stroke-width:1;}
.fr .lab{font-size:10px;font-family:var(--f-mono);}
.fr .tip{position:absolute;pointer-events:none;background:var(--sunk);border:1px solid var(--rule-strong);padding:.3rem .45rem;
  font-size:.66rem;line-height:1.45;min-width:150px;z-index:5;}
.fr .tip .h{color:var(--ink);font-weight:600;margin-bottom:.1rem;}
.fr .tip .r{display:flex;justify-content:space-between;gap:.8rem;color:var(--ink-mid);}
.fkey{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.4rem;font-size:.64rem;color:var(--ink-mid);}
.fkey span{display:inline-flex;align-items:center;gap:.35rem;}
.read{font-family:var(--f-ui);font-size:.76rem;color:var(--ink-mid);margin:.55rem 0 0;line-height:1.55;}
.read p{margin:.3rem 0;}
.read b{color:var(--ink);font-weight:500;}

/* the mix */
.mix{display:grid;grid-template-columns:minmax(110px,180px) 1fr 58px 58px 86px;gap:.18rem .6rem;align-items:center;font-size:.68rem;}
.mix .h{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.mix .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
.mix .n small{color:var(--ink-soft);margin-left:.3rem;}
.mix .num{text-align:right;font-variant-numeric:tabular-nums;}
.mix .rng{text-align:right;color:var(--ink-soft);font-size:.62rem;}
.bars{position:relative;height:14px;}
.bars i{position:absolute;left:0;height:5px;}
.bars i.b{top:1px;background:var(--ink-soft);}
.bars i.t{top:8px;background:var(--accent);}
.bars i.w{top:6px;height:7px;border-left:1px solid var(--ink-mid);border-right:1px solid var(--ink-mid);
  background:linear-gradient(var(--ink-mid),var(--ink-mid)) center/100% 1px no-repeat;opacity:.8;}
@media(max-width:620px){.mix{grid-template-columns:minmax(90px,1fr) 1fr 48px 48px;}.mix .rng{display:none;}}

/* the plan */
.costs{display:flex;flex-wrap:wrap;gap:.3rem .6rem;margin:.35rem 0 .2rem;font-size:.64rem;color:var(--ink-mid);}
.costs span{border:1px solid var(--rule-strong);padding:.08rem .4rem;}
.first{font-family:var(--f-ui);font-size:.8rem;color:var(--ink);margin:.5rem 0;line-height:1.5;}
.first b{font-weight:600;}
.tbl td.dim{color:var(--ink-soft);}
.tbl tr.wait td{color:var(--ink-soft);}

/* views */
.vform{display:flex;flex-wrap:wrap;gap:.45rem .8rem;align-items:center;font-size:.68rem;margin-top:.5rem;}
.vform select,.vform input{background:var(--ground);border:1px solid var(--rule-strong);color:var(--ink);padding:.18rem .35rem;
  font-family:var(--f-mono);font-size:.7rem;}
.vform input.r{width:7ch;}
.vform input.note{width:24ch;}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;}
.lnk:hover{text-decoration:underline;}
.txt{font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);line-height:1.6;}
.txt p{margin:.35rem 0;}
.txt b{color:var(--ink);font-weight:500;}
.sec{margin:1rem 0 .35rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--rule);padding-bottom:.2rem;}
.sec:first-child{margin-top:0;}
details summary{cursor:pointer;color:var(--accent);font-size:.7rem;margin:.2rem 0;}
.empty{font-size:.74rem;color:var(--ink-soft);font-family:var(--f-ui);padding:.4rem 0;}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<script src="/term.js"></script>
<script src="/kit.js"></script>
<script src="/mvo.js"></script>
</body>
</html>

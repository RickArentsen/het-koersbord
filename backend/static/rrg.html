<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRG · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
/* The four quadrants keep one colour each everywhere on the page: the graph,
   the badges and the legend. They are the terminal's own direction colours
   plus its one blue, so nothing new is introduced. */
:root{ --q-leading:var(--gain); --q-weakening:var(--warn); --q-lagging:var(--loss); --q-improving:var(--accent); }

.rg{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,1fr);gap:.7rem;align-items:start;}
@media(max-width:1100px){.rg{grid-template-columns:1fr;}}
.rg>*{min-width:0;}

#rrg{position:relative;width:100%;}
#rrg svg{display:block;width:100%;overflow:visible;user-select:none;}
#rrg .ax{font-size:10px;fill:var(--ink-soft);font-family:var(--f-mono);}
#rrg .gl{stroke:var(--rule);stroke-width:1;}
#rrg .cl{stroke:var(--rule-strong);stroke-width:1;}
#rrg .ql{font-size:10px;font-family:var(--f-mono);letter-spacing:.14em;font-weight:600;opacity:.75;}
#rrg .nm{font-size:10.5px;font-family:var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;}
#rrg g.it{cursor:pointer;}
#rrg g.it.dimmed{opacity:.16;}
#rrg g.it.on .nm{font-weight:600;}
.rtip{position:absolute;z-index:20;pointer-events:none;background:rgba(5,8,10,.96);border:1px solid var(--rule-strong);
  padding:.35rem .5rem;font-size:.66rem;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.5);white-space:nowrap;}
.rtip b{font-size:.74rem;}

.play{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;font-size:.7rem;color:var(--ink-mid);}
.play input[type=range]{flex:1;accent-color:var(--accent);min-width:120px;}
.play .when{min-width:11ch;text-align:right;color:var(--ink);}

.say{margin:0;padding:0;list-style:none;font-family:var(--f-ui);font-size:.8rem;line-height:1.5;}
.say li{padding:.2rem 0 .2rem .8rem;position:relative;border-bottom:1px dotted var(--rule);}
.say li:last-child{border-bottom:0;}
.say li::before{content:"";position:absolute;left:0;top:.78em;width:4px;height:4px;background:var(--accent);}
.qk{display:grid;grid-template-columns:auto 1fr;gap:.3rem .6rem;font-size:.74rem;align-items:baseline;margin-top:.2rem;}
.qk .t{font-family:var(--f-ui);color:var(--ink-mid);line-height:1.4;}
.qb{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:0 .3rem;font-weight:600;white-space:nowrap;}
.qb.leading{color:var(--q-leading);} .qb.weakening{color:var(--q-weakening);}
.qb.lagging{color:var(--q-lagging);} .qb.improving{color:var(--q-improving);}
.turn{display:inline-block;width:1em;text-align:center;color:var(--ink-mid);}
.tbl tr.pin td{background:#0D161B;}
.tbl tr.pin td:first-child{box-shadow:inset 2px 0 0 var(--accent);}
.tbl tbody tr{cursor:pointer;}
#follow .tbl tbody tr{cursor:default;}

/* Bigger graph: full width puts the text under it; full screen fills the screen. */
#graphPanel header{flex-wrap:wrap;}
.zbar{margin-left:auto;display:flex;gap:.4rem;}
.zbar .seg{font-size:.62rem;}
#rrg.zoomed svg{cursor:grab;}
#rrg.zoomed svg:active{cursor:grabbing;}
.znote{position:absolute;right:20px;top:20px;font-size:.6rem;color:var(--ink-soft);background:rgba(5,8,10,.85);padding:.1rem .35rem;border:1px solid var(--rule);pointer-events:none;}
.rrg-wide .rg{grid-template-columns:1fr;}
.rrg-wide .rg>.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;}
#graphPanel:fullscreen{background:var(--ground);overflow:auto;padding:.4rem .8rem;}
#graphPanel::backdrop{background:var(--ground);}

/* One name in depth */
.dhd{font-size:.82rem;display:flex;gap:.45rem;align-items:baseline;flex-wrap:wrap;}
.qstrip{display:flex;height:16px;gap:2px;margin-top:.3rem;}
.qs{display:flex;align-items:center;justify-content:center;font-size:.55rem;color:var(--ground);font-weight:600;min-width:4px;}
.qs.leading{background:var(--q-leading);} .qs.weakening{background:var(--q-weakening);}
.qs.lagging{background:var(--q-lagging);} .qs.improving{background:var(--q-improving);}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.5rem;}
.dc{border:1px solid var(--rule);padding:.3rem .4rem;}
.dc .k{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.dc .v{font-size:.9rem;margin:.1rem 0;}
.dc .t{font-size:.6rem;color:var(--ink-soft);line-height:1.35;font-family:var(--f-ui);}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<script src="/term.js"></script>
<script src="/kit.js"></script>
<script src="/rrg.js"></script>
</body>
</html>

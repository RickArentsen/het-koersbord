<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OIL · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
/* ten tiles wrap onto two rows; borders on the tiles, so an unfilled row shows no grey block */
#tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;background:none;border:0;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule);}
#tiles .tile{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);}
#tiles .tile .s{-webkit-line-clamp:4;}
.og{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:.8rem;align-items:start;}
@media(max-width:1100px){.og{grid-template-columns:1fr;}}
.og>*{min-width:0;}
.hd-links{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.68rem;margin-top:.5rem;}
.howto{font-family:var(--f-ui);font-size:.74rem;line-height:1.55;color:var(--ink-mid);margin:.5rem 0 0;}
.howto b{color:var(--ink);font-weight:500;}
.howto summary{cursor:pointer;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.howto summary:hover{color:var(--ink);}
.howto p{margin:.35rem 0;}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 .5rem;}
.mini{font-size:.62rem;color:var(--ink-soft);}
.k-warn{color:var(--warn);} .k-bad{color:var(--loss);} .k-good{color:var(--gain);}

/* status words */
.st{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap;}
.st.shut{color:#ff6b57;} .st.severe{color:#f0884f;} .st.reduced{color:var(--warn);} .st.normal{color:var(--gain);} .st.busy{color:var(--accent);}

/* sparklines in tables */
.spk{display:inline-block;vertical-align:middle;}
.spk svg{display:block;}
.tbl td.spkc{padding-top:.1rem;padding-bottom:.1rem;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{background:#0E151A;}
.tbl tr.you td{background:rgba(79,168,206,.07);}
.tbl tr.you td:first-child{box-shadow:inset 2px 0 0 var(--accent);}

/* the map */
#mapbox{position:relative;width:100%;background:#060a0d;border:1px solid var(--rule);overflow:hidden;touch-action:none;}
#mapbox canvas{display:block;width:100%;cursor:grab;}
#mapbox canvas.drag{cursor:grabbing;}
.map-tip{position:absolute;z-index:5;pointer-events:none;background:rgba(8,12,15,.96);border:1px solid var(--rule-strong);
  padding:.35rem .5rem;font-size:.68rem;line-height:1.4;max-width:300px;}
.map-tip b{color:var(--ink);}
.map-ctl{position:absolute;right:.5rem;top:.5rem;display:flex;flex-direction:column;gap:.25rem;z-index:4;}
.map-ctl button{background:rgba(11,16,19,.9);border:1px solid var(--rule-strong);font-size:.7rem;padding:.15rem .45rem;min-width:2rem;}
.map-ctl button:hover{border-color:var(--accent);}
.map-ctl button.on{border-color:var(--accent);color:var(--accent);}

/* the legend sits beside the globe and under the flat map, never on top of either */
.map-leg{font-size:.62rem;color:var(--ink-mid);line-height:1.5;}
.map-leg .lg b{display:block;color:var(--ink);font-weight:500;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;}
.map-leg .it{display:inline-flex;align-items:center;gap:.28rem;margin-right:.65rem;white-space:nowrap;}
.map-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;box-sizing:border-box;}
.map-leg i.sq{border-radius:0;width:7px;height:7px;}
.map-leg i.ln{border-radius:0;width:16px;height:0;border-top:2px dashed;}
.map-leg i.grad{border-radius:0;width:64px;height:7px;background:linear-gradient(90deg,#111a20,#2b6f8f);}
.map-leg .tri{font-size:.62rem;line-height:1;}
.map-leg .ds,.map-leg .its,.map-leg .nt{display:block;}
.mapwrap.flat .map-leg{display:flex;flex-wrap:wrap;gap:.35rem 1.6rem;padding:.45rem .1rem 0;}
.mapwrap.flat .map-leg .lg>*{display:inline;margin-right:.5rem;}
.mapwrap.globe{display:grid;grid-template-columns:minmax(0,1fr) 220px;}
.mapwrap.globe .map-leg{background:#060a0d;border:1px solid var(--rule);border-left:0;padding:.65rem .75rem;
  display:flex;flex-direction:column;gap:.75rem;overflow:auto;contain:size;}  /* the globe sets the height; a long legend scrolls */
@media(max-width:760px){.mapwrap.globe{grid-template-columns:1fr;} .mapwrap.globe .map-leg{border-left:1px solid var(--rule);border-top:0;contain:none;}}
.map-status{font-size:.62rem;color:var(--ink-soft);margin-top:.35rem;line-height:1.5;}
.rail{min-height:120px;}
.rail h3{font-size:.8rem;margin:0 0 .3rem;}
.rail .kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .7rem;font-size:.7rem;}
.rail .kv span:nth-child(odd){color:var(--ink-soft);}
.rail .back{font-size:.64rem;display:inline-block;margin-bottom:.45rem;}
.rail .tbl{font-size:.68rem;}

/* the map filling the whole tab */
#s-map>header .hint{flex:1;}
#mapQuote{display:none;font-size:.7rem;color:var(--ink-mid);flex:1;}
#mapQuote b{color:var(--ink);font-weight:500;}
#s-map.full{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;border:0;}
#s-map.full>header .hint{display:none;}
#s-map.full #mapQuote{display:block;}
#s-map.full>.body{flex:1;min-height:0;display:flex;flex-direction:column;}
#s-map.full .og{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-rows:minmax(0,1fr);align-items:stretch;}
#s-map.full .mapcol{display:flex;flex-direction:column;min-height:0;}
#s-map.full .mapwrap{flex:1;min-height:0;}
#s-map.full .mapwrap.flat{display:flex;flex-direction:column;}
#s-map.full .mapwrap.flat #mapbox{flex:1;min-height:0;}
#s-map.full .mapwrap.globe{grid-template-rows:minmax(0,1fr);}
#s-map.full #mapbox canvas{position:absolute;inset:0;height:100%;}
#s-map.full .rail{overflow:auto;min-height:0;border-left:1px solid var(--rule);padding-left:.8rem;}
@media(max-width:1100px){#s-map.full .og{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;}
  #s-map.full .rail{max-height:32vh;border-left:0;padding-left:0;}}
body.mapfull{overflow:hidden;}

/* the country drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);z-index:120;background:var(--surface);
  border-left:1px solid var(--rule-strong);box-shadow:-20px 0 40px rgba(0,0,0,.45);overflow:auto;transform:translateX(105%);
  transition:transform .18s ease;}
#drawer.on{transform:none;}
#drawer .dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule-strong);padding:.55rem .8rem;
  display:flex;align-items:center;gap:.6rem;z-index:2;}
#drawer .dh h2{margin:0;font-size:.95rem;letter-spacing:.06em;}
#drawer .db{padding:.7rem .8rem 2rem;}
#drawer .sec{margin:.9rem 0 .3rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--rule);padding-bottom:.2rem;}

/* sankey */
#sankey svg{display:block;width:100%;}
#sankey .nd{font-size:10px;font-family:var(--f-mono);fill:var(--ink-mid);}
#sankey path.rb{fill-opacity:.32;}
#sankey path.rb:hover,#sankey path.rb.hot{fill-opacity:.7;}

/* seasonal band chart */
.band svg{display:block;width:100%;overflow:visible;}
.band .ax{font-size:10px;fill:var(--ink-soft);font-family:var(--f-mono);}
.band .gl{stroke:var(--rule);stroke-width:1;}

/* traders cards */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:.5rem;}
.who div{background:var(--surface);padding:.5rem .6rem;}
.who b{font-size:.74rem;}
.who .w{font-size:.66rem;color:var(--ink-soft);margin:.15rem 0 .25rem;}
.who p{margin:0;font-family:var(--f-ui);font-size:.72rem;line-height:1.45;color:var(--ink-mid);}

/* alerts */
.alrt{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.7rem;}
.alrt select,.alrt input{background:var(--ground);border:1px solid var(--rule-strong);padding:.14rem .4rem;font-size:.7rem;}
.alrt input{width:8ch;text-align:right;}
.alrt input.nt{width:20ch;text-align:left;}

/* Claude */
.md{font-family:var(--f-ui);font-size:.84rem;line-height:1.6;color:var(--ink);max-width:88ch;}
.md h1{font-family:var(--f-mono);font-size:1.02rem;letter-spacing:.02em;margin:.4rem 0 .6rem;line-height:1.35;}
.md h2{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mid);margin:1.2rem 0 .4rem;border-bottom:1px solid var(--rule);padding-bottom:.2rem;}
.md h3{font-size:.84rem;margin:.9rem 0 .3rem;}
.md p{margin:.45rem 0;}
.md ul,.md ol{margin:.35rem 0;padding-left:1.3rem;}
.md li{margin:.2rem 0;}
.md strong{font-weight:600;color:#DCE6EA;}
.md code{font-family:var(--f-mono);font-size:.76rem;background:var(--sunk);padding:0 .2rem;}
.md blockquote{margin:.5rem 0;padding:.1rem .7rem;border-left:2px solid var(--rule-strong);color:var(--ink-mid);}
.md table{border-collapse:collapse;margin:.5rem 0;font-family:var(--f-mono);font-size:.72rem;}
.md th,.md td{border-bottom:1px solid var(--rule);padding:.22rem .5rem;text-align:right;}
.md th:first-child,.md td:first-child{text-align:left;}
.qbox{display:flex;gap:.4rem;margin-top:.6rem;}
.qbox input{flex:1;background:var(--ground);border:1px solid var(--rule-strong);padding:.3rem .5rem;font-size:.74rem;}
.writing{opacity:.85;border-left:2px solid var(--accent);padding-left:.6rem;}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<div id="drawer" aria-hidden="true"></div>
<script src="/term.js"></script>
<script src="/kit.js"></script>
<script src="/oilmap.js"></script>
<script src="/oil.js"></script>
</body>
</html>

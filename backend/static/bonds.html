.jbar{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 7.5rem;gap:.5rem;align-items:center;font-size:.7rem;padding:.16rem 0;}
.jbar .l{color:var(--ink-mid);font-family:var(--f-ui);}

.jbar .b i{display:block;height:100%;background:var(--ink-soft);}
.jbar.now .l{color:var(--ink);font-weight:600;} .jbar.now .b i{background:var(--accent);}
.jbar.avg .b i{background:var(--rule-strong);}
.jbar .v{text-align:right;}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYS · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;}
.fhead h1{font-size:1.15rem;letter-spacing:.04em;margin:0;font-weight:600;}
.fhead .sp{flex:1;}
.st{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:0 .35rem;border:1px solid var(--rule-strong);white-space:nowrap;}
.st.ok{color:var(--gain);border-color:var(--gain);} .st.late{color:var(--warn);border-color:var(--warn-dim);}
.st.failing{color:var(--loss);border-color:var(--loss);} .st.idle{color:var(--ink-soft);}
.tbl td.l{text-align:left;} .tbl td.err{color:var(--loss);font-family:var(--f-ui);font-size:.68rem;text-align:left;max-width:30rem;}
.tbl td.what{font-family:var(--f-ui);font-size:.68rem;color:var(--ink-mid);text-align:left;}
.grp{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.expl{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-mid);line-height:1.55;margin:.5rem 0;max-width:64rem;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.35rem;}
.dot.on{background:var(--gain);} .dot.off{background:var(--loss);}
.thr{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.7rem;}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.22rem 0;border-bottom:1px dotted var(--rule);font-size:.72rem;}
.kv>span:first-child{color:var(--ink-mid);}
.kv>span:last-child{text-align:right;}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<script src="/term.js"></script>
<script src="/kit.js"></script>
<script src="/sys.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERN · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/term.css">
<style>
/* One validated identity hue (the bond page's --s1) for "a series"; direction
   keeps green and red; amber is "wants attention" — live, estimated, evasive. */
:root{ --s1:#3987e5; --s2:#d95926; --barh:36px; }

.stack{display:flex;flex-direction:column;gap:.7rem;min-width:0;}
.src{font-size:.64rem;color:var(--ink-soft);margin-top:.45rem;line-height:1.45;}
.ld{padding:1rem 0;}
.sp{flex:1;}
.prose{font-family:var(--f-ui);font-size:.78rem;line-height:1.5;color:var(--ink-mid);max-width:95ch;}
.prose b{color:var(--ink);font-weight:500;}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem;}
.two.even{grid-template-columns:1fr 1fr;}
@media(max-width:1000px){.two,.two.even{grid-template-columns:1fr;}}
.two>*{min-width:0;}
.note.plain{border-color:var(--rule-strong);background:var(--sunk);margin:.5rem 0;color:var(--ink-mid);}

/* header */
.hdr{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:.5rem;}
.hdr h1{font-size:1.25rem;letter-spacing:.08em;margin:0;font-weight:600;}
.hdr .sub{font-size:.68rem;color:var(--ink-soft);}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);}
.tile{background:var(--surface);padding:.42rem .55rem;min-width:0;}
.tile .k{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .v{font-size:1.1rem;font-weight:600;margin:.05rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .v small{font-size:.7rem;font-weight:500;margin-left:.3rem;color:var(--ink-mid);}
.tile .s{font-size:.62rem;color:var(--ink-soft);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tile.lead{box-shadow:inset 0 2px 0 var(--accent);}
.tile.click{cursor:pointer;} .tile.click:hover{background:#0E151A;}

/* sections */
.secnav{position:sticky;top:var(--barh);z-index:40;display:flex;overflow-x:auto;background:var(--sunk);
  border:1px solid var(--rule-strong);scrollbar-width:none;margin:.7rem 0;}
.secnav::-webkit-scrollbar{display:none;}
.secnav a{padding:.34rem .7rem;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent;}
.secnav a:hover{color:var(--ink);text-decoration:none;}
[id^="s-"]{scroll-margin-top:calc(var(--barh) + 40px);}

/* controls */
.seg{background:var(--ground);border:1px solid var(--rule-strong);color:var(--ink-mid);font-size:.66rem;padding:.16rem .5rem;letter-spacing:.04em;}
.seg:hover{border-color:var(--accent);color:var(--ink);}
.seg.on{background:var(--accent-dim);border-color:var(--accent);color:var(--ink);}
.seg:disabled{opacity:.4;cursor:default;}
.seg.go{border-color:var(--accent);color:var(--accent);}
.seg.warn{border-color:var(--warn);color:var(--warn);}
.fbar{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.5rem;}
.fbar .grp{display:inline-flex;gap:0;margin:0;}
.fbar .grp .seg{margin-left:-1px;}
.fbar .lbl{font-size:.6rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;margin-right:.2rem;}
.fbar input[type=text]{background:var(--ground);border:1px solid var(--rule-strong);padding:.14rem .45rem;font-size:.7rem;width:170px;}
.fbar input[type=text]:focus{border-color:var(--accent);outline:none;}
.wk{font-size:.78rem;font-weight:600;margin:0 .4rem;}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule-strong);margin:.3rem 0 .6rem;}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-soft);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:.34rem .6rem;margin-bottom:-1px;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:.3rem;vertical-align:middle;}

/* the week grid */
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
.day{background:var(--surface);min-height:120px;display:flex;flex-direction:column;min-width:0;}
.day.today{box-shadow:inset 0 2px 0 var(--accent);}
.day.past .dh{opacity:.75;}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:.35rem .5rem;border-bottom:1px solid var(--rule);background:var(--sunk);}
.dh b{font-size:.74rem;letter-spacing:.06em;}
.dh span{font-size:.6rem;color:var(--ink-soft);}
.slot{padding:.25rem .35rem .35rem;}
.slot .sl{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:.15rem .15rem .2rem;display:flex;gap:.3rem;align-items:center;}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:.1rem .4rem;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-left:2px solid transparent;padding:.22rem .35rem;margin-bottom:1px;color:inherit;align-items:baseline;}
.ev:hover{background:#0E151A;border-color:var(--rule-strong);}
.ev.held{border-left-color:var(--accent);background:rgba(79,168,206,.05);}
.ev.watch{border-left-color:var(--ink-soft);}
.ev.sel{border-color:var(--accent);}
.ev .t{font-weight:600;font-size:.74rem;}
.ev .n{font-family:var(--f-ui);font-size:.66rem;color:var(--ink-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev .r{font-size:.64rem;white-space:nowrap;}
.ev .m{grid-column:1/-1;font-size:.6rem;color:var(--ink-soft);display:flex;gap:.45rem;flex-wrap:wrap;}
.ev .m .tie{color:var(--accent);}
.ev .w{color:var(--accent);}
.dayfoot{margin-top:auto;padding:.2rem .5rem .35rem;font-size:.6rem;color:var(--ink-soft);}
.empty{font-size:.66rem;color:var(--ink-soft);padding:.5rem .6rem;}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pl 1.2s infinite;}
.pulse.ok{background:var(--gain);animation:none;}
@keyframes pl{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}

/* tables */
.tscroll{overflow-x:auto;max-width:100%;}
.tbl{border-collapse:collapse;width:100%;font-size:.72rem;}
.tbl th{font-weight:500;color:var(--ink-soft);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:.25rem .45rem;border-bottom:1px solid var(--rule-strong);white-space:nowrap;}
.tbl td{text-align:right;padding:.22rem .45rem;border-bottom:1px dotted var(--rule);white-space:nowrap;}
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left;}
.tbl tbody tr:hover td{background:#0E151A;}
.tbl tr.pick{cursor:pointer;}
.tbl td.w{white-space:normal;font-family:var(--f-ui);font-size:.7rem;color:var(--ink-mid);min-width:220px;text-align:left;}
.tbl tr.sec td{color:var(--ink-soft);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;padding-top:.55rem;border-bottom:1px solid var(--rule-strong);}
@media(max-width:560px){.tbl{font-size:.66rem;}.tbl th,.tbl td{padding:.2rem .3rem;}}
.bdg{font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;padding:0 .28rem;font-weight:500;white-space:nowrap;}
.bdg.good{color:var(--gain);} .bdg.warn{color:var(--warn);} .bdg.bad{color:var(--loss);} .bdg.info{color:var(--ink-mid);} .bdg.acc{color:var(--accent);}
.rng{display:inline-block;position:relative;width:70px;height:6px;background:var(--sunk);border:1px solid var(--rule-strong);vertical-align:middle;margin-left:.3rem;}
.rng i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink);margin-left:-1px;}
.rng b{position:absolute;top:-3px;width:2px;height:10px;background:var(--warn);margin-left:-1px;}

/* the event drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(1020px,100vw);z-index:120;background:var(--ground);
  border-left:1px solid var(--rule-strong);box-shadow:-12px 0 40px rgba(0,0,0,.55);transform:translateX(104%);
  transition:transform .18s ease-out;display:flex;flex-direction:column;}
#drawer.open{transform:none;}
#scrim{position:fixed;inset:0;z-index:110;background:rgba(3,6,8,.55);display:none;}
#scrim.open{display:block;}
.dw-h{padding:.6rem .9rem .3rem;border-bottom:1px solid var(--rule-strong);background:var(--sunk);}
.dw-b{flex:1;overflow-y:auto;padding:.4rem .9rem 2rem;scrollbar-width:thin;}
.dw-t{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;}
.dw-t h2{margin:0;font-size:1.05rem;letter-spacing:.06em;}
.dw-t .nm{font-family:var(--f-ui);font-size:.8rem;color:var(--ink-mid);}
.dw-m{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.68rem;color:var(--ink-mid);margin:.3rem 0 .2rem;align-items:center;}
.dw-m b{color:var(--ink);font-weight:500;}
.x{background:none;border:1px solid var(--rule-strong);color:var(--ink-mid);width:26px;height:24px;font-size:.8rem;}
.x:hover{border-color:var(--accent);color:var(--ink);}
.blk{margin:.2rem 0 1rem;}
.blk>h3{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin:.4rem 0 .45rem;
  border-bottom:1px solid var(--rule);padding-bottom:.25rem;display:flex;gap:.5rem;align-items:baseline;}
.blk>h3 .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-size:.62rem;}
.say{margin:0;padding-left:1rem;font-family:var(--f-ui);font-size:.77rem;line-height:1.5;color:var(--ink-mid);}
.say li{margin:.18rem 0;}
.say li b{color:var(--ink);font-weight:500;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);}
.kv>div{background:var(--surface);padding:.4rem .55rem;min-width:0;}
.kv .k{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.kv .v{font-size:1rem;font-weight:600;margin:.08rem 0;}
.kv .t{font-size:.64rem;color:var(--ink-soft);line-height:1.4;}

/* lines of the free write-up */
.al{display:grid;grid-template-columns:18px 1fr;gap:.35rem;padding:.25rem 0;border-bottom:1px dotted var(--rule);font-family:var(--f-ui);font-size:.78rem;line-height:1.45;}
.al:last-child{border-bottom:0;}
.al i{font-style:normal;text-align:center;font-family:var(--f-mono);font-size:.7rem;}
.al.good i{color:var(--gain);} .al.bad i{color:var(--loss);} .al.warn i{color:var(--warn);} .al.info i{color:var(--accent);}
.alh{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:.6rem 0 .1rem;}

/* the Claude report */
.md{font-family:var(--f-ui);font-size:.84rem;line-height:1.6;color:var(--ink);max-width:88ch;}
.md h1{font-family:var(--f-mono);font-size:1.02rem;letter-spacing:.02em;margin:.4rem 0 .6rem;line-height:1.35;}
.md h2{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mid);margin:1.2rem 0 .4rem;border-bottom:1px solid var(--rule);padding-bottom:.2rem;}
.md h3{font-size:.84rem;margin:.9rem 0 .3rem;}
.md p{margin:.45rem 0;}
.md ul,.md ol{margin:.35rem 0;padding-left:1.3rem;}
.md li{margin:.2rem 0;}
.md strong{font-weight:600;color:#DCE6EA;}
.md code{font-family:var(--f-mono);font-size:.76rem;background:var(--sunk);padding:0 .2rem;}
.md table{border-collapse:collapse;margin:.5rem 0;font-family:var(--f-mono);font-size:.72rem;}
.md th,.md td{border-bottom:1px solid var(--rule);padding:.22rem .5rem;text-align:right;}
.md th{color:var(--ink-soft);font-weight:500;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;}
.md th:first-child,.md td:first-child{text-align:left;}
.md .tag{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.06em;color:var(--ink-soft);border:1px solid var(--rule-strong);padding:0 .2rem;margin-left:.1rem;vertical-align:1px;}
.md blockquote{margin:.5rem 0;padding:.1rem .7rem;border-left:2px solid var(--rule-strong);color:var(--ink-mid);}
.writing{border:1px solid var(--rule-strong);background:var(--sunk);padding:.6rem .8rem;margin:.5rem 0;max-height:520px;overflow-y:auto;}
.qa{border-top:1px solid var(--rule);padding:.5rem 0;}
.qa .q{font-size:.72rem;color:var(--accent);margin-bottom:.2rem;}
textarea.in,input.in,select.in{width:100%;background:var(--ground);border:1px solid var(--rule-strong);padding:.35rem .5rem;font-size:.74rem;font-family:var(--f-ui);color:var(--ink);}
textarea.in:focus,input.in:focus,select.in:focus{border-color:var(--accent);outline:none;}
.frm{display:grid;grid-template-columns:120px 1fr;gap:.4rem .6rem;align-items:center;font-size:.7rem;max-width:760px;}
.frm label{color:var(--ink-soft);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;}
@media(max-width:560px){.frm{grid-template-columns:1fr;}}

/* sources */
.srcs{display:flex;flex-direction:column;}
.si{display:grid;grid-template-columns:82px 1fr auto;gap:.5rem;padding:.35rem 0;border-bottom:1px dotted var(--rule);align-items:baseline;font-size:.72rem;}
.si .k{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;}
.si .nt{font-size:.64rem;color:var(--ink-soft);font-family:var(--f-ui);}
.si.ok .k{color:var(--gain);} .si.waiting .k{color:var(--warn);} .si.missing .k{color:var(--ink-soft);}

/* the call */
.tone{display:grid;grid-template-columns:130px 1fr 54px;gap:.5rem;align-items:center;font-size:.7rem;padding:.15rem 0;}
.tone .tr{position:relative;height:10px;background:var(--sunk);}
.tone .tr .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--rule-strong);}
.tone .tr i{position:absolute;top:1px;bottom:1px;border-radius:2px;}
.tone .tr i.neg{background:var(--loss);} .tone .tr i.pos{background:var(--gain);}
.qq{padding:.4rem 0;border-bottom:1px dotted var(--rule);}
.qq .who{font-size:.66rem;color:var(--ink-soft);display:flex;gap:.5rem;flex-wrap:wrap;align-items:baseline;}
.qq .who b{color:var(--ink);font-weight:500;}
.qq .qt{font-family:var(--f-ui);font-size:.76rem;line-height:1.45;margin-top:.15rem;}
.turn{padding:.35rem 0;border-bottom:1px dotted var(--rule);}
.turn .sp{font-size:.66rem;color:var(--accent);}
.turn.analyst .sp{color:var(--warn);}
.turn.operator .sp{color:var(--ink-soft);}
.turn .tx{font-family:var(--f-ui);font-size:.76rem;line-height:1.5;color:var(--ink-mid);white-space:pre-wrap;}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;}
.chip{font-size:.64rem;border:1px solid var(--rule-strong);padding:.05rem .4rem;color:var(--ink-mid);}
.chip.new{border-color:var(--gain);color:var(--gain);}
.chip.gone{border-color:var(--rule-strong);color:var(--ink-soft);text-decoration:line-through;}

/* live */
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);}
.lv>div{background:var(--surface);padding:.45rem .6rem;}
.lv .k{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:.35rem;align-items:center;}
.lv .v{font-size:.9rem;font-weight:600;margin:.1rem 0;}
.lv .t{font-size:.64rem;color:var(--ink-soft);font-family:var(--f-ui);line-height:1.4;}
.livebar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0;}
.livecard{display:flex;gap:.5rem;align-items:center;border:1px solid var(--warn);background:var(--warn-dim);padding:.3rem .6rem;font-size:.72rem;cursor:pointer;}
.livecard.ok{border-color:var(--gain);background:rgba(63,179,128,.08);}
.livecard b{font-weight:600;}
.logl{font-size:.64rem;color:var(--ink-soft);max-height:160px;overflow-y:auto;}

/* charts */
.lc{position:relative;width:100%;}
.lc svg{display:block;width:100%;overflow:visible;}
.lc .ax{font-size:10px;fill:var(--ink-soft);font-family:var(--f-mono);}
.lc .gl{stroke:var(--rule);stroke-width:1;}
.lc .zl{stroke:var(--rule-strong);stroke-width:1;}
.lc .ref{stroke:var(--warn);stroke-width:1;stroke-dasharray:4 3;}
.lc .hit{fill:transparent;cursor:crosshair;}
.lc .hit:hover+.bar,.lc .bar:hover{opacity:.8;}
.lc-tip{position:absolute;z-index:20;pointer-events:none;background:rgba(5,8,10,.96);border:1px solid var(--rule-strong);padding:.35rem .5rem;font-size:.66rem;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.5);white-space:nowrap;}
.lc-tip .h{color:var(--ink-soft);margin-bottom:.1rem;}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin:.35rem 0 0;font-size:.62rem;color:var(--ink-soft);}
.legend .sw{display:inline-block;width:10px;height:8px;margin-right:.25rem;vertical-align:middle;border-radius:1px;}
.legend .ln{display:inline-block;width:14px;height:0;border-top:1px dashed var(--warn);margin-right:.25rem;vertical-align:middle;}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Earnings event" aria-hidden="true"></aside>
<script src="/term.js"></script>
<script src="/earnings.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAI · Het Koersbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080A'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 7' stroke='%234FA8CE' stroke-width='3' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/term.css">
<link rel="stylesheet" href="/kit.css">
<style>
.intro{font-family:var(--f-ui);font-size:.84rem;color:var(--ink-mid);line-height:1.6;max-width:72ch;}
.intro b{color:var(--ink);font-weight:500;}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.4rem 1.2rem;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-mid);margin:.8rem 0;max-width:72rem;}
.rules div{border-left:2px solid var(--rule-strong);padding:.1rem .6rem;}
.rules b{display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;}
.go{background:var(--accent);border:1px solid var(--accent);color:#00161F;font-weight:600;font-size:.78rem;padding:.4rem .9rem;letter-spacing:.06em;}
.go:disabled{opacity:.5;cursor:default;}
.status{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;font-size:.68rem;color:var(--ink-mid);margin:.2rem 0 .6rem;}
.status b{color:var(--ink);font-weight:500;}
.status .sp{flex:1;}
.rival{font-family:var(--f-ui);font-size:.86rem;color:var(--ink);border-left:2px solid var(--accent);padding:.3rem .7rem;margin:.2rem 0 .6rem;background:rgba(79,168,206,.06);}
.rival span{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-right:.5rem;}
.job{border:1px solid var(--accent-dim);background:rgba(79,168,206,.06);padding:.5rem .7rem;font-size:.72rem;margin:.4rem 0;}
.job.err{border-color:var(--loss);background:rgba(220,70,60,.06);}
.job .tail{font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);margin-top:.35rem;max-height:5.5em;overflow:hidden;white-space:pre-wrap;}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start;margin-top:1rem;}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr);}}
.sec{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:1rem 0 .35rem;padding-bottom:.25rem;border-bottom:1px solid var(--rule-strong);}
.sec:first-child{margin-top:0;}
.dec{border:1px solid var(--rule);padding:.6rem .75rem;margin-bottom:.6rem;background:var(--sunk);}
.dec .hd{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;font-size:.66rem;color:var(--ink-soft);}
.dec .hd .kind{border:1px solid var(--rule-strong);padding:0 .3rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mid);}
.dec .hd .kind.event{border-color:#b5652e;color:#e09a62;}
.dec .hd .kind.start{border-color:var(--accent);color:var(--accent);}
.dec .why{font-size:.68rem;color:var(--ink-soft);margin-top:.2rem;}
.dec .jr{font-family:var(--f-ui);font-size:.84rem;color:var(--ink);line-height:1.55;margin:.4rem 0;white-space:pre-wrap;}
.dec .msg{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-mid);font-style:italic;margin:.3rem 0;}
.ord{display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem;font-size:.72rem;padding:.35rem 0;border-bottom:1px dotted var(--rule);}
.ord .a{font-weight:600;}
.ord .a.BUY{color:var(--gain);} .ord .a.SELL{color:var(--loss);}
.ord .w{font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);line-height:1.45;grid-column:2;}
.ord .st{font-size:.62rem;color:var(--ink-soft);grid-column:2;}
.ord.rej .a{color:var(--ink-soft);text-decoration:line-through;}
.th{font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);line-height:1.45;padding:.25rem 0;border-bottom:1px dotted var(--rule);}
.th b{font-family:var(--f-mono);font-size:.68rem;color:var(--ink);font-weight:500;margin-right:.4rem;}
.tbl.pos .nm{display:inline-block;max-width:16ch;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;}
.tbl.pos tr.pr td{border-bottom:0;}
.tbl.pos tr.thr td{padding:0 .45rem .45rem;min-width:0;line-height:1.45;}
.dec .hd .kind.review{border-color:var(--warn);color:var(--warn);}
.rv .sum{font-family:var(--f-ui);font-size:.84rem;color:var(--ink);line-height:1.55;margin:.4rem 0;}
.rv .lst{font-family:var(--f-ui);font-size:.76rem;color:var(--ink-mid);line-height:1.5;margin:.15rem 0 .3rem;padding-left:1.1rem;}
.rv .lab{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:.5rem;}
.gr{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.1rem .55rem;align-items:baseline;font-size:.72rem;
    padding:.3rem 0;border-bottom:1px dotted var(--rule);}
.gr .g{font-weight:600;min-width:1.2rem;text-align:center;border:1px solid currentColor;padding:0 .2rem;}
.gr .g.A{color:var(--gain);} .gr .g.B{color:#8fc9a6;} .gr .g.C{color:var(--warn);} .gr .g.D,.gr .g.F{color:var(--loss);}
.gr .w{grid-column:3;font-family:var(--f-ui);font-size:.74rem;color:var(--ink-mid);line-height:1.45;}
.gr .ts{font-size:.62rem;color:var(--ink-soft);}
.revBtn{background:none;border:1px solid var(--rule-strong);color:var(--accent);font-size:.66rem;padding:.15rem .5rem;float:right;margin-top:-.2rem;}
.more,.sentBtn,.revSent{background:none;border:0;color:var(--accent);font-size:.68rem;padding:.2rem 0;}
.sentBtn,.revSent{display:block;margin-top:.3rem;}
.sent{max-height:28rem;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:.64rem;line-height:1.45;color:var(--ink-mid);background:var(--ground);border:1px solid var(--rule);padding:.5rem .6rem;margin:.3rem 0 0;}
.foot{font-family:var(--f-ui);font-size:.68rem;color:var(--ink-soft);line-height:1.55;margin-top:1rem;max-width:80ch;}
</style>
</head>
<body>
<div id="shell"></div>
<div class="wrap" id="app"><div class="center">Loading<span class="blink">_</span></div></div>
<script src="/term.js"></script>
<script src="/kit.js"></script>
<script src="/kai.js"></script>
</body>
</html>

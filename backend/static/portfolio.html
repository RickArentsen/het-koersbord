       <input type="text" id="fCountry" value="${esc(r.country||"")}" placeholder="e.g. United States"></div>

     <div id="editOut"></div>`,
    `<span class="sub" id="editHint">Changes apply on save and take effect immediately.</span>
     <button class="btn" id="editCancel">Cancel</button>
     <button class="btn primary" id="editSave">Save</button>`);

  $("#editCancel").onclick = closeModal;
  $("#editSave").onclick = async () => {
    const body={};
    const t=$("#fTicker").value.trim(); if(t) body.ticker=t;
    const p=$("#fPrice").value.trim();  if(p!=="") body.manual_price=parseFloat(p);
    const s=$("#fSector").value.trim(); if(s) body.sector_override=s;
    const c=$("#fCountry").value.trim();if(c) body.country_override=c;
    const fin=($("#fFin")||{value:""}).value.trim();
    if(!Object.keys(body).length && !fin){ $("#editOut").innerHTML=`<div class="note">Nothing changed.</div>`; return; }
    $("#editSave").disabled=true; $("#editSave").textContent="Saving…";
    try{
      if(fin){
        const rf=await fetch(`/api/pf/instrument/${encodeURIComponent(isin)}/financing`,{
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:fin})});
        const jf=await rf.json().catch(()=>({}));
        // 404 or 405: the server running is older than this page (build 34)
        if(rf.status===404||rf.status===405)
          throw new Error("The terminal's server is older than this page: restart it (start-portfolio.bat) and try again.");
        if(!rf.ok) throw new Error(jf.detail||`${rf.status}`);
      }
      if(Object.keys(body).length){
        const r2=await fetch(`/api/pf/instrument/${encodeURIComponent(isin)}`,{
          method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
        const j=await r2.json().catch(()=>({}));
        if(!r2.ok) throw new Error(j.detail||`${r2.status}`);
      }
      closeModal(); await load();
    }catch(e){
      $("#editOut").innerHTML=`<div class="note err"><b>Could not save</b>${esc(e.message)}</div>`;
      $("#editSave").disabled=false; $("#editSave").textContent="Save";
    }
  };
}

/* ================= import ================= */
let HOLDINGS=[];

async function importModal(){
  openModal("Add transactions",
    `<span class="tabs" id="impTabs" style="margin-bottom:.9rem">
       <button data-t="file" aria-pressed="true">Import files</button>
       <button data-t="hand" aria-pressed="false">Enter by hand</button>
     </span>
     <div id="impFile">
       <div class="drop" id="drop">Drop <b>Transactions.csv</b> and <b>Account.csv</b> here<br>
         <span class="sub">or</span>
         <label style="color:var(--accent);cursor:pointer;text-decoration:underline">choose files<input type="file" id="file" multiple accept=".csv,text/csv" class="hide"></label>
       </div>
       <p class="sub" style="margin:.7rem 0 0">Both files matter. <b>Transactions.csv</b> has the trades;
       <b>Account.csv</b> has dividends, fees, interest, deposits and currency conversions.
       Nothing is written until you press Commit, and re-importing an overlapping period is safe.</p>
       <div id="importOut"></div>
     </div>
     <div id="impHand" class="hide">
       <p class="sub" style="margin:0 0 .8rem">For positions DEGIRO's exports cannot give you. A trade entered
       here is not paid from your DEGIRO cash: what it costs counts as capital you put in on that date, and
       what a sale brings in as capital taken out. A trade done at DEGIRO belongs in the CSV import instead.</p>
       <div class="field"><label for="mKind">Type</label>
         <select id="mKind"><option value="BUY">Buy</option><option value="SELL">Sell</option></select></div>

       <div class="field"><label for="mIsin">Instrument</label>
         <input list="mList" id="mIsin" placeholder="start typing a name, or paste an ISIN">
         <datalist id="mList"></datalist>
         <span class="fh" id="mHeld">Pick something you already hold, or enter a new ISIN.</span></div>

       <div class="field hide" id="mNewWrap"><label for="mName">Name</label>
         <input type="text" id="mName" placeholder="e.g. ASML HOLDING NV">
         <span class="fh">New instrument — give it a name, and a ticker if you know one.</span></div>
       <div class="field hide" id="mTickWrap"><label for="mTicker">Quote symbol</label>
         <input type="text" id="mTicker" placeholder="e.g. ASML.AS"></div>

       <div class="field"><label for="mDate">Trade date</label>
         <input type="date" id="mDate"></div>
       <div class="field"><label for="mQty">Quantity</label>
         <input type="number" step="any" min="0" id="mQty" placeholder="4"></div>
       <div class="field"><label for="mPrice">Price per unit</label>
         <input type="number" step="any" min="0" id="mPrice" placeholder="165.00"></div>
       <div class="field"><label for="mCcy">Currency</label>
         <select id="mCcy"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select></div>
       <div class="field hide" id="mFxWrap"><label for="mFx">FX rate</label>
         <input type="number" step="any" id="mFx" placeholder="leave blank to use the rate for that date">
         <span class="fh">Units of the trade currency per 1 EUR — the same convention as DEGIRO's Wisselkoers (EUR/USD ≈ 1.16).</span></div>
       <div class="field"><label for="mFee">Costs (EUR)</label>
         <input type="number" step="any" min="0" id="mFee" placeholder="2.00" value="0"></div>

       <div class="note" id="mPreview" style="margin-top:.4rem">Fill in quantity and price to see the euro total.</div>
       <div id="mOut"></div>
       <h3 style="border:0;padding:.9rem 0 .4rem">Entered by hand</h3>
       <div id="mList2" class="sub">loading…</div>
     </div>`,
    `<button class="btn" id="impClose">Close</button>
     <button class="btn primary hide" id="mSave">Add transaction</button>`);

  $("#impClose").onclick = closeModal;
  document.querySelectorAll("#impTabs button").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    document.querySelectorAll("#impTabs button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    $("#impFile").classList.toggle("hide", t!=="file");
    $("#impHand").classList.toggle("hide", t!=="hand");
    $("#mSave").classList.toggle("hide", t!=="hand");
  });
  wireImport();
  await wireManual();
}

async function wireManual(){
  $("#mDate").value = new Date().toISOString().slice(0,10);
  try{ HOLDINGS = await (await fetch("/api/pf/holdings/simple")).json(); }catch{ HOLDINGS=[]; }
  $("#mList").innerHTML = HOLDINGS.map(h=>
    `<option value="${esc(h.isin)}">${esc(h.name)}${h.qty?` — ${h.qty} held`:""}</option>`).join("");

  const find = () => {
    const v=$("#mIsin").value.trim().toUpperCase();
    return HOLDINGS.find(h=>h.isin===v) ||
           HOLDINGS.find(h=>h.name.toUpperCase()===v) || null;
  };

  const sync = () => {
    const h=find(), isNew=!h && $("#mIsin").value.trim().length>0;
    $("#mNewWrap").classList.toggle("hide", !isNew);
    $("#mTickWrap").classList.toggle("hide", !isNew);
    $("#mFxWrap").classList.toggle("hide", $("#mCcy").value==="EUR");
    if(h){
      $("#mCcy").value = ["EUR","USD","GBP","CHF"].includes(h.currency) ? h.currency : "EUR";
      $("#mFxWrap").classList.toggle("hide", $("#mCcy").value==="EUR");
      $("#mHeld").innerHTML = h.qty
        ? `<b>${esc(h.name)}</b> — you hold <b>${h.qty}</b>${h.avg_price?` at ${h.avg_price} ${esc(h.currency)} average`:""}.`
        : `<b>${esc(h.name)}</b> — none held right now.`;
    } else if(isNew){
      $("#mHeld").textContent = "Not in the ledger yet — it will be created.";
    } else {
      $("#mHeld").textContent = "Pick something you already hold, or enter a new ISIN.";
    }
    const q=parseFloat($("#mQty").value), p=parseFloat($("#mPrice").value),
          fee=parseFloat($("#mFee").value)||0, ccy=$("#mCcy").value,
          fx=parseFloat($("#mFx").value)|| (ccy==="EUR"?1:null);
    if(q>0 && p>0){
      const gross=q*p;
      if(fx){
        const e=gross/fx, buy=$("#mKind").value==="BUY";
        $("#mPreview").innerHTML = `<b>${buy?"Cost":"Proceeds"}</b>
          ${q} × ${p} ${esc(ccy)} = ${gross.toFixed(2)} ${esc(ccy)}${ccy!=="EUR"?` ÷ ${fx} = ${eur(e,2)}`:""}
          ${fee?` ${buy?"+":"−"} ${eur(fee,2)} costs`:""} → <b>${eur(buy?-(e+fee):(e-fee),2)}</b>`;
      } else {
        $("#mPreview").innerHTML = `<b>${q} × ${p} ${esc(ccy)} = ${gross.toFixed(2)} ${esc(ccy)}</b>
          — the ${esc(ccy)}/EUR rate for that date will be used, or enter one above.`;
      }
    } else $("#mPreview").textContent = "Fill in quantity and price to see the euro total.";
  };
  ["mIsin","mQty","mPrice","mCcy","mFx","mFee","mKind"].forEach(id=>{
    const el=$("#"+id); el.oninput=sync; el.onchange=sync; });
  sync();
  await refreshManualList();

  $("#mSave").onclick = async () => {
    const h=find();
    const body={
      kind: $("#mKind").value,
      isin: (h? h.isin : $("#mIsin").value.trim().toUpperCase()),
      trade_date: $("#mDate").value,
      quantity: parseFloat($("#mQty").value),
      price: parseFloat($("#mPrice").value),
      currency: $("#mCcy").value,
      fx_rate: parseFloat($("#mFx").value) || null,
      fee_eur: parseFloat($("#mFee").value) || 0,
      name: h? null : ($("#mName").value.trim() || null),
      ticker: h? null : ($("#mTicker").value.trim() || null),
    };
    $("#mSave").disabled=true; $("#mSave").textContent="Adding…";
    try{
      const r=await fetch("/api/pf/transaction",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
      $("#mOut").innerHTML=`<div class="note ok"><b>Added</b>
        ${body.kind==="BUY"?"Cost":"Proceeds"} ${eur(j.total_eur,2)} at an FX rate of ${j.fx_rate} (${esc(j.fx_source)}).</div>`;
      $("#mQty").value=""; $("#mPrice").value="";
      await load(); await wireManual();
    }catch(e){
      $("#mOut").innerHTML=`<div class="note err"><b>Not added</b>${esc(e.message)}</div>`;
    }finally{ $("#mSave").disabled=false; $("#mSave").textContent="Add transaction"; }
  };
}

function wireImport(){
  const drop=$("#drop"), file=$("#file"); if(!drop) return;
  let staged=[];
  const show = h => { const o=$("#importOut"); if(o) o.innerHTML=h; };

  async function post(url, files){
    const fd=new FormData(); files.forEach(f=>fd.append("files",f));
    const r=await fetch(url,{method:"POST",body:fd});
    const text=await r.text();
    let j; try{ j=JSON.parse(text); }catch{ j={detail:text.slice(0,300)}; }
    if(!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
    return j;
  }

  async function preview(files){
    staged=[...files];
    if(!staged.length) return;
    show(`<p class="sub" style="margin-top:.7rem">Reading ${staged.length} file(s)…</p>`);
    try{
      const j = await post("/api/pf/import/preview", staged);
      show(`<div style="margin-top:.7rem">
        <div class="kv"><span>Rows parsed</span><span>${j.parsed}</span></div>
        <div class="kv"><span>Already present (skipped)</span><span>${j.duplicates}</span></div>
        <div class="kv"><span><b>New rows to add</b></span><span><b>${j.new}</b></span></div>
        <div class="kv"><span>Instruments not yet known</span><span>${j.unmapped_isins.length}</span></div>
        <p class="sub" style="margin:.6rem 0">${j.files.map(f=>`${esc(f.file)} → <b>${f.kind}</b> (${f.rows} rows)`).join("<br>")}</p>
        <button class="btn primary" id="commitBtn" ${j.new?"":"disabled"}>${j.new?`Commit ${j.new} rows`:"Nothing new to import"}</button>
      </div>`);
      const cb=$("#commitBtn");
      if(cb) cb.onclick=async()=>{
        cb.disabled=true; cb.textContent="Committing…";
        try{
          const jj = await post("/api/pf/import/commit", staged);
          show(`<div class="note ok" style="margin-top:.7rem"><b>Imported</b>
            ${jj.inserted} rows added, ${jj.skipped_duplicates} duplicates skipped.</div>`);
          await load();
        }catch(e){
          show(`<div class="note err" style="margin-top:.7rem"><b>Commit failed</b>${esc(e.message)}</div>`);
        }
      };
    }catch(e){
      show(`<div class="note err" style="margin-top:.7rem"><b>Could not read those files</b>${esc(e.message)}
        <br><span class="sub">If this mentions python-multipart, run
        <code>pip install -r requirements-portfolio.txt</code> in the backend folder and restart.</span></div>`);
    }
  }

  drop.ondragover=e=>{e.preventDefault();drop.classList.add("hot");};
  drop.ondragleave=()=>drop.classList.remove("hot");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("hot");preview(e.dataTransfer.files);};
  file.onchange=e=>preview(e.target.files);
}

async function refreshManualList(){
  const box=$("#mList2"); if(!box) return;
  try{
    const rows=await (await fetch("/api/pf/transaction/manual")).json();
    if(!rows.length){ box.textContent="Nothing entered by hand yet."; return; }
    box.innerHTML=`<div class="tablewrap" style="max-height:200px"><table><tbody>${rows.map(r=>`
      <tr><td class="l">${dmy(r.trade_dt)}</td>
        <td class="l"><b>${r.quantity>0?"BUY":"SELL"}</b> ${Math.abs(r.quantity)} ${esc((r.product||"").slice(0,26))}</td>
        <td>${r.price} ${esc(r.currency||"")}</td><td>${eur(r.total_eur,2)}</td>
        <td><button class="btn" data-del="${r.id}" style="padding:.1rem .45rem;font-size:.7rem">remove</button></td></tr>`).join("")}
      </tbody></table></div>`;
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ev=>{
      ev.stopPropagation();
      b.disabled=true;
      try{
        const r=await fetch(`/api/pf/transaction/${b.dataset.del}`,{method:"DELETE"});
        const j=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.detail||r.status);
        await load(); await wireManual();
      }catch(e){ $("#mOut").innerHTML=`<div class="note err"><b>Not removed</b>${esc(e.message)}</div>`; b.disabled=false; }
    });
  }catch{ box.textContent="Could not load hand-entered rows."; }
}

load();
</script>
